version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: isonga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: isonga_connect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isonga_connect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isonga-network

  redis:
    image: redis:7-alpine
    container_name: isonga-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - isonga-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  isonga-network:
    driver: bridge
